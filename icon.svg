<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8789a"/>
      <stop offset="50%" style="stop-color:#d4567a"/>
      <stop offset="100%" style="stop-color:#c9a96e"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d693"/>
      <stop offset="100%" style="stop-color:#c9a96e"/>
    </linearGradient>
  </defs>
  <!-- Soft circle background -->
  <circle cx="256" cy="256" r="248" fill="#fff5f7" stroke="#e8789a" stroke-width="8" opacity="0.95"/>
  <!-- Heart -->
  <path d="M256 420c-8 0-16-3-22-9C148 332 100 278 80 240c-24-46-20-98 10-132 
    28-32 72-42 112-26 12 5 24 12 34 22 4 4 12 12 20 22 8-10 16-18 20-22 
    10-10 22-17 34-22 40-16 84-6 112 26 30 34 34 86 10 132-20 38-68 92-154 171-6 6-14 9-22 9z" 
    fill="url(#heartGrad)" transform="translate(0,-10)"/>
  <!-- Sparkle top-right -->
  <g transform="translate(370,110)" fill="url(#sparkleGrad)">
    <path d="M0-32 L6-6 L32 0 L6 6 L0 32 L-6 6 L-32 0 L-6-6 Z"/>
  </g>
  <!-- Small sparkle -->
  <g transform="translate(150,130) scale(0.5)" fill="url(#sparkleGrad)">
    <path d="M0-32 L6-6 L32 0 L6 6 L0 32 L-6 6 L-32 0 L-6-6 Z"/>
  </g>
  <!-- Tiny sparkle -->
  <g transform="translate(400,200) scale(0.35)" fill="url(#sparkleGrad)">
    <path d="M0-32 L6-6 L32 0 L6 6 L0 32 L-6 6 L-32 0 L-6-6 Z"/>
  </g>
  <!-- PM initials -->
  <text x="256" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="white" opacity="0.9">PM</text>
</svg>
